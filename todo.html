<!DOCTYPE html>  
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Mood To-Do</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e0c3fc, #8ec5fc);
      text-align: center;
      padding: 40px;
      transition: 0.5s;
      color: #333;
    }

    body.dark {
      background: linear-gradient(to right, #232526, #414345);
      color: white;
    }

    input, select, button, a {
      margin: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      font-size: 16px;
    }

    button {
      background-color: #7b4bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #5a34c4;
    }

    .link-btn {
      background-color: #00b894;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      display: inline-block;
    }

    .link-btn:hover {
      background-color: #019875;
    }

    .home-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 24px;
      text-decoration: none;
      background: #ffffffcc;
      padding: 8px 14px;
      border-radius: 50px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: 0.3s ease;
      z-index: 1000;
    }

    .home-btn:hover {
      background-color: #f1f1f1;
      transform: scale(1.05);
    }

    .toggle-theme {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 22px;
      padding: 12px;
      width: 48px;
      height: 48px;
      background-color: #ffffffdd;
      color: #333;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toggle-theme:hover {
      transform: scale(1.1);
      background-color: #f1f1f1;
    }

    .container {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    body.dark .container {
      background: #2c2c2c;
    }
  </style>
</head>

<body>
  <a href="index.html" class="home-btn" title="Go to Home">🏠</a>
  <button class="toggle-theme" title="Toggle Theme">🌙</button>

  <div class="container">
    <h2>🌈 Mood-Based To-Do List</h2>
    
    <input type="text" id="taskInput" placeholder="Enter your task..."><br>

      <select id="moodSelect" >
      <option>Select ur Mood...</option>
      <option>😊 Happy</option>
      <option>😢 Sad</option>
      <option>😡 Angry</option>
      <option>😌 Calm</option>
    </select><br>

    <input type="date" id="dueDate"><br>

    <button onclick="addTask()">Add Task</button><br>

    <a href="view.html" class="link-btn">📋 View Task List</a>
  </div>

  <script>
    // Theme Toggle 
    const toggleBtn = document.querySelector(".toggle-theme");
    const body = document.body;

    toggleBtn.addEventListener("click", () => {
      body.classList.toggle("dark");
      const isDark = body.classList.contains("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      toggleBtn.textContent = isDark ? "☀️" : "🌙";
    });

    // Add Task 
    function addTask() {
      const task = document.getElementById("taskInput").value.trim();
      const mood = document.getElementById("moodSelect").value;
      const date = document.getElementById("dueDate").value;

      if (!task || !date) {
        alert("Please enter all details!");
        return;
      }

      const newTask = { task, mood, date };
      const tasks = JSON.parse(localStorage.getItem("tasks")) || [];
      tasks.push(newTask);
      localStorage.setItem("tasks", JSON.stringify(tasks));

      alert("Task added!");
      document.getElementById("taskInput").value = "";
      document.getElementById("dueDate").value = "";
    }
  </script>
</body>
</html>
