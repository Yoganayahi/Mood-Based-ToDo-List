<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Mood Tasks</title>
  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #a1c4fd, #c2e9fb);
      text-align: center;
      padding: 30px;
    }
    .task {
      background: white;
      padding: 15px;
      margin: 10px auto;
      width: 300px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: left;
      transition: background 0.3s ease;
    }

    .task.done {
      background: #d4edda;
      text-decoration: line-through;
      opacity: 0.8;
    }

    .task button {
      margin-top: 10px;
      margin-right: 10px;
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .done-btn {
      background-color: #2ecc71;
      color: white;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #4b7bec;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
    }

    a:hover {
      background: #3867d6;
    }
  </style>
</head>
<body>

  <h1>📝 Your Mood Tasks</h1>
  <div id="taskList"></div>

  <a href="todo.html">➕ Back to Add Task</a>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";

      if (tasks.length === 0) {
        taskList.innerHTML = "<p>No tasks yet!</p>";
        return;
      }

      tasks.forEach((t, index) => {
        const div = document.createElement("div");
        div.className = "task" + (t.done ? " done" : "");
        div.innerHTML = `
          <p><strong>📄 Task:</strong> ${t.task}</p>
          <p><strong>😊 Mood:</strong> ${t.mood}</p>
          <p><strong>📅 Due:</strong> ${t.date}</p>
          <button class="done-btn" onclick="toggleDone(${index})">${t.done ? "Undo" : "Done"}</button>
          <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
        `;
        taskList.appendChild(div);
      });
    }

    function toggleDone(index) {
      tasks[index].done = !tasks[index].done;
      saveTasks();
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    renderTasks();
  </script>

</body>
</html>
