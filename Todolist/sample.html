<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Mood To-Do</title>
  <style>
    * {
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0c3fc, #8ec5fc);
      color: #333;
    }
    .dark {
      background: #121212;
      color: #eee;
    }
    .container {
      max-width: 650px;
      margin: 50px auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .dark .container {
      background: #1f1f1f;
    }


    h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 10px;
      margin: 5px 0;
      border: 10px;
      border-radius: 10px;
      font-size: 16px;
      width: 100%;
      border: 1px solid #ccc;
      outline: none;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
    }
    .toggle-theme {
      float: right;
      background: #333;
      color: white;
    }

    .dark .toggle-theme {
      background: #eee;
      color: #333;
    }

    .flex-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button:hover {
      background-color: #a29bfe;
    }

    .task {
      padding: 15px;
      margin-top: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.4s ease;
    }

    .task.completed {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .task span {
      flex: 1;
      cursor: pointer;
    }

    .task .actions {
      display: flex;
      gap: 5px;
    }

    .task button {
      background: #d63031;
      color: white;
      padding: 6px 10px;
    }

    .task .edit-btn {
      background: #00b894;
    }

    .happy {
      background: linear-gradient(to right, #ffeaa7, #fab1a0);
    }

    .sad {
      background: linear-gradient(to right, #74b9ff, #a29bfe);
    }

    .focused {
      background: linear-gradient(to right, #55efc4, #81ecec);
    }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .search-filter {
      margin-top: 20px;
    }

    .meta {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
   <div class="container">
    <button class="toggle-theme">🌙 Dark Mode</button>
    <h2>🌈 Mood-Based To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter your task..." />
    <div class="flex-row">
      <select id="moodSelect">
        <option value="happy">😄 Happy</option>
        <option value="sad">😢 Sad</option>
        <option value="focused">🎯 Focused</option>
      </select>
      <input type="date" id="dueDate" />
    </div>
    <button onclick="addTask()">Add Task</button>

    <div class="search-filter flex-row">
      <input type="text" id="searchInput" placeholder="🔎 Search..." oninput="filterTasks()" />
      <select id="filterMood" onchange="filterTasks()">
        <option value="all">All Moods</option>
        <option value="happy">😄 Happy</option>
        <option value="sad">😢 Sad</option>
        <option value="focused">🎯 Focused</option>
      </select>
    </div>

    <!-- Task list -->
    <div id="taskList"></div>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const moodSelect = document.getElementById("moodSelect");
    const dueDate = document.getElementById("dueDate");
    const taskList = document.getElementById("taskList");

    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem("moodTasks") || "[]");
      saved.forEach(t => createTask(t.text, t.mood, t.due, t.completed));
    };

    function addTask() {
      const text = taskInput.value.trim();
      const mood = moodSelect.value;
      const due = dueDate.value;

      if (text !== "") {
        createTask(text, mood, due, false);
        saveTasks();
        taskInput.value = "";
        dueDate.value = "";
      }
    }

    function createTask(text, mood, due, completed) {
      const div = document.createElement("div");
      div.className = `task ${mood}`;
      if (completed) div.classList.add("completed");

      const emoji = mood === "happy" ? "😄" : mood === "sad" ? "😢" : "🎯";

      div.innerHTML = `
        <div style="flex:1">
          <span onclick="toggleComplete(this)">${emoji} ${text}</span><br/>
          <span class="meta">📅 ${due || "No date"}</span>
        </div>
        <div class="actions">
          <button class="edit-btn" onclick="editTask(this)">✏️</button>
          <button onclick="deleteTask(this)">❌</button>
        </div>
      `;
      taskList.appendChild(div);
    }

    function toggleComplete(span) {
      span.closest(".task").classList.toggle("completed");
      saveTasks();
    }

    function deleteTask(btn) {
      const task = btn.closest(".task");
      task.style.opacity = "0";
      setTimeout(() => {
        task.remove();
        saveTasks();
      }, 300);
    }

    function editTask(btn) {
      const task = btn.closest(".task");
      const span = task.querySelector("span");
      const oldText = span.textContent.slice(2);
      const newText = prompt("Edit task:", oldText);
      if (newText) {
        span.innerHTML = span.innerHTML.slice(0, 2) + " " + newText;
        saveTasks();
      }
    }

    function saveTasks() {
      const data = [];
      document.querySelectorAll(".task").forEach(task => {
        const text = task.querySelector("span").innerText.slice(2);
        const mood = task.classList.contains("happy") ? "happy" :
                     task.classList.contains("sad") ? "sad" : "focused";
        const completed = task.classList.contains("completed");
        const due = task.querySelector(".meta").textContent.replace("📅", "").trim();
        data.push({ text, mood, due, completed });
      });
      localStorage.setItem("moodTasks", JSON.stringify(data));
      filterTasks(); // Apply filter after saving
    }

    function filterTasks() {
      const keyword = document.getElementById("searchInput").value.toLowerCase();
      const moodFilter = document.getElementById("filterMood").value;

      document.querySelectorAll(".task").forEach(task => {
        const text = task.querySelector("span").textContent.toLowerCase();
        const moodClass = task.classList.contains("happy") ? "happy" :
                          task.classList.contains("sad") ? "sad" : "focused";
        const moodMatch = (moodFilter === "all" || moodFilter === moodClass);
        const textMatch = text.includes(keyword);
        task.style.display = (moodMatch && textMatch) ? "flex" : "none";
      });
    }
  </script>
